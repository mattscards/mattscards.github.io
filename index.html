<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matt's Card Collection</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #ff0000;  /* FIX: Changed card backgrounds to solid theme red */
            --text-main: #ffffff; /* All body text rows are crisp white */
            --accent: #ff0000;   
            --success: #107B13;  /* Restored your rich corporate green for money values */
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2d2d2d;
            padding-bottom: 20px;
        }
        .stats-box {
            background-color: #ffffff;
            color: var(--accent);
            padding: 15px 25px;
            border-radius: 8px;
            text-align: right;
            font-weight: bold;
            border: 2px solid var(--accent);
        }
        .stats-box span {
            font-size: 1.5rem;
            font-weight: bold;
            display: block;
            color: var(--accent); 
            margin-top: 5px;
        }
        .grid-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .card-link {
            text-decoration: none !important;
            color: inherit !important;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            border: 2px solid #ff0000;
        }
        .card:hover {
            transform: translateY(-2px);
            border-color: #ffffff !important;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }
        .card-img {
            width: 100%;
            height: 380px;
            background-color: #1a1a1a;
            object-fit: contain;
            padding-top: 10px;
            display: block;
        }
        .card-info {
            padding: 20px;
        }
        .card-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .card-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 0 0 15px 0;
            line-height: 1.4;
            color: #ff0000; 
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
        .card-details {
            font-size: 0.95rem;
            color: #ffffff;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .card-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #111827;
            margin: 0 -20px -20px -20px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
        }
        #error-msg { 
            color: var(--accent); 
            font-weight: bold; 
            text-align: center; 
            grid-column: 1 / -1;
            padding: 40px; 
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column !important;
                align-items: center !important;
                text-align: center !important;
                gap: 20px;
            }
            header div {
                align-items: center !important;
            }
            header img {
                align-self: center !important;
                max-height: 90px !important;
            }
            .stats-box {
                width: 90%;
                text-align: center !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <img src="header.png" alt="MATT'S CARDS" style="max-height: 120px; width: auto; object-fit: contain; align-self: flex-start;">
            <p style="margin:0; color:#ffffff; font-size: 1.2rem; font-weight: bold; letter-spacing: 0.05em; text-transform: uppercase;
                      text-shadow: 1px 1px 0px #334155, 2px 2px 0px #1e293b, 3px 3px 0px #0f172a, 4px 4px 5px rgba(0,0,0,0.8);">
                Sports Card Portfolio & Live Valuation
            </p>
        </div>
        <div class="stats-box">
            Total Estimated Value
            <span id="total-portfolio-value">$0.00</span>
        </div>
    </header>

    <main class="grid-container" id="gallery-grid">
        <div id="error-msg">Loading your collection live...</div>
    </main>

    <script>
        const MY_COLLECTION_URL = 'https://www.sportscardspro.com/offers?seller=xpx2saa54ajblfoc25cjsiw7ne&status=collection';

        fetch('collection.csv')
        .then(res => {
            if (!res.ok) throw new Error("Could not find collection.csv in folder.");
            return res.text();
        })
        .then(csvText => {
            const grid = document.getElementById('gallery-grid');
            const lines = csvText.trim().split('\n');
            const totalValueEl = document.getElementById('total-portfolio-value');
            
            grid.innerHTML = ''; 
            let totalPortfolioSum = 0;

            if (lines.length === 0 || csvText.trim() === "") {
                grid.innerHTML = '<div id="error-msg">The collection.csv file appears to be completely empty.</div>';
                return;
            }

            for (let i = 1; i < lines.length; i++) {
                const lineText = lines[i].trim();
                if (!lineText) continue; 

                const cells = lineText.split(',');

                const cardID = cells[0] ? cells[0].replace(/^"|"$/g, '').trim() : '';
                const productName = cells[1] ? cells[1].replace(/^"|"$/g, '').trim() : 'Unknown Card';
                
                let sport = cells[2] ? cells[2].replace(/^"|"$/g, '').trim() : '';
                sport = sport.replace(' Cards', ''); 

                const priceInPennies = parseFloat(cells[3] ? cells[3].replace(/^"|"$/g, '').trim() : 0) || 0;
                const price = priceInPennies / 100;

                const includeString = cells[4] ? cells[4].replace(/^"|"$/g, '').trim() : '';
                const quantity = parseInt(cells[9] ? cells[9].replace(/^"|"$/g, '').trim() : 1) || 1;
                const gradingCompany = cells[12] ? cells[12].replace(/^"|"$/g, '').trim() : '';
                
                totalPortfolioSum += (price * quantity);

                const photoUrl = cardID ? `${cardID}.jpg` : 'https://unsplash.com';

                let finalDetailsLabel = includeString;
                if (gradingCompany && gradingCompany !== 'None' && gradingCompany !== 'null' && gradingCompany !== 'undefined') {
                    finalDetailsLabel = `${gradingCompany} - ${includeString}`;
                }

                let qtyDisplay = quantity > 1 ? `<strong>Qty:</strong> ${quantity}<br>` : '';

                const cardHtml = `
                    <a href="${MY_COLLECTION_URL}" target="_blank" class="card-link">
                        <div class="card">
                            <img src="${photoUrl}" alt="${productName}" class="card-img" onerror="this.onerror=null; this.src='https://unsplash.com';">
                            <div class="card-info">
                                <div class="card-tag">${sport}</div>
                                <div class="card-title">${productName}</div>
                                <div class="card-details">
                                    <strong>Details:</strong> ${finalDetailsLabel} <br>
                                    ${qtyDisplay}
                                </div>
                                <div class="card-price">
                                    <span>Est. Value:</span>
                                    <span style="color:var(--success);">$${price.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>
                    </a>
                `;
                grid.innerHTML += cardHtml;
            }

            totalValueEl.innerText = `$${totalPortfolioSum.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        })
        .catch(err => {
            document.getElementById('gallery-grid').innerHTML = '<div id="error-msg">System Failure: ' + err.message + '</div>';
            console.error(err);
        });
    </script>

</body>
</html>
