<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATT'S CARDS - Sports Card Portfolio & Live Valuation</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --text-main: #ffffff;
            --accent: #ff0000;
            --success: #107B13;
        }
        a {
            color: #ff0000 !important;
            text-decoration: none;
        }
        a:hover {
            color: #ff3333 !important;
            text-decoration: underline;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 20px;
        }
        .stats-box {
            background-color: #1e293b;
            color: #ffffff;
            padding: 15px 25px;
            border-radius: 8px;
            text-align: right;
            font-weight: bold;               
            border: 2px solid var(--accent);
        }
        .stats-box span {
            font-size: 1.5rem;
            font-weight: bold;
            display: block;
            color: var(--success);
            margin-top: 5px;                 
        }
        .grid-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            border: 1px solid #2d2d2d; 
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent); 
            box-shadow: 0 10px 20px rgba(255, 0, 0, 0.15); 
        }
        .card-img {
            width: 100%;
            height: 350px;
            background-color: #e5e7eb;
            object-fit: cover;
        }
        .card-info {
            padding: 20px;
        }
        .card-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6b7280;
            margin-bottom: 5px;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 0 0 10px 0;
        }
        .card-details {
            font-size: 0.9rem;
            color: #4b5563;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .card-price {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent);
            border-top: 1px solid #f3f4f6;
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
        }
        #loading {
            text-align: center;
            font-size: 1.2rem;
            grid-column: 1 / -1;
            padding: 40px;
        }
        @media (max-width: 768px) {
         header {
            flex-direction: column !important;
            align-items: center !important;
            text-align: center !important;
            gap: 20px;
        }
         header div {
            align-items: center !important;
        }
         header img {
            align-self: center !important;
            max-height: 90px !important;
        }
         .stats-box {
            width: 90%;
            text-align: center !important;
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <img src="header.png" alt="Matt's Cards" style="max-height: 120px; width: auto; object-fit: contain; align-self: flex-start;">
            
            <p style="margin:0; color:#ffffff; font-size: 1.2rem; font-weight: bold; letter-spacing: 0.05em; text-transform: uppercase;
                      text-shadow: 1px 1px 0px #334155, 
                                   2px 2px 0px #1e293b, 
                                   3px 3px 0px #0f172a,
                                   4px 4px 5px rgba(0,0,0,0.8);">
                Sports Card Portfolio & Live Valuation
            </p>
        </div>
        <div class="stats-box">
            Total Estimated Value
            <span id="total-portfolio-value">$0.00</span>
        </div>
    </header>

    <main style="max-width: 1200px; margin: 0 auto; padding: 20px;">
        <iframe src="https://www.sportscardspro.com/offers?seller=xpx2saa54ajblfoc25cjsiw7ne&status=collection" 
                style="width: 100%; height: 800px; border: 1px solid #2d2d2d; border-radius: 12px; background-color: #121212;">
        </iframe>
    </main>    

</body>
</html>
