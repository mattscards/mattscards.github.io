<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matt'$ Card$</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #860000;  
            --text-main: #ffffff; 
            --accent: #860000;   
            --success: #008000; 
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between; 
            align-items: center;
            border-bottom: none !important;
            padding-bottom: 20px;
        }
        .stats-box {
            background-color: #ffffff;
            color: #000000; 
            padding: 12px 20px;
            border-radius: 8px;
            text-align: center; 
            font-weight: bold;
            border: 4px solid #FF0000; 
            width: max-content; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }
        .stats-box span {
            font-size: 2.3rem; 
            font-weight: bold;
            display: block;
            color: var(--success); 
            margin-top: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }
        .stats-link-box {
            display: inline-block;
            border-radius: 8px;
            transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .stats-link-box:hover {
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.6);
            transform: translateY(-2px); /* Lifts the box slightly up */
        }
        .stats-link-box:active {
            transform: scale(0.97);
            opacity: 0.9;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.8);
        }
        .grid-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 20px;
        }
        .card-link {
            text-decoration: none !important;
            color: inherit !important;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            border: 2px solid #ffffff;
        }
        .grid-container {
            background-color: #000000 !important;
            border: 4px solid #FF0000 !important;
            border-radius: 12px !important;
            padding: 25px !important;
            margin-top: 20px !important;
            margin-bottom: 20px !important;
        }
        .card:hover {
            transform: translateY(-2px);
            border-color: #ffffff !important; 
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6); 
        }
        .card-img {
            width: 100%;
            height: 260px; 
            background-color: #000000; 
            object-fit: contain;
            padding-top: 8px;
            display: block;
        }
        .card-info {
            padding: 12px;
        }
        .card-tag {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #ffffff; 
            font-weight: bold;
            margin-bottom: 4px;
            text-align: center; 
            text-shadow: 2px 2px 8px #ff0000;
        }
        .card-title {
            font-size: 1.15rem; 
            font-weight: bold; 
            margin: 0 0 10px 0;
            line-height: 1.3;
            color: #ffffff; 
            -webkit-text-stroke: unset; 
            text-shadow: 2px 2px 8px #000000;
            text-align: center; 
        }
        .card-details {
            font-size: 0.8rem; 
            color: #ffffff; 
            margin-bottom: 10px;
            line-height: 1.4;
            text-align: center; 
            text-shadow: 2px 2px 8px #ff0000;
        }
        .card-price {
            font-size: 0.95rem; 
            font-weight: bold;
            color: #ffffff; 
            background-color: #000000; 
            margin: 0 -12px -12px -12px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            text-align: left;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .card-price span:last-child {
            color: var(--success) !important;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        #error-msg { 
            color: var(--accent); 
            font-weight: bold; 
            text-align: center; 
            grid-column: 1 / -1;
            padding: 40px; 
        }
        .bottom-banner-wrapper {
            position: relative;
            width: 100% !important;
            max-width: 1200px !important;
            padding-top: 30px !important;
            margin: 0 auto !important;
            z-index: 10;
        }
        .bottom-banner-container {
            max-width: 1200px !important; 
            width: 25% !important;
            margin: 0 auto !important;
            padding: 0;
        }
        .bottom-banner-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        @media (max-width: 768px) {
        header, #main-header {
            flex-direction: column !important;
            gap: 20px !important;
            text-align: center !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
            width: 100% !important;
        }
        header div, #main-header div {
            align-items: center !important;
            width: 100% !important;
        }
        header img, #main-header img {
            align-self: center !important;
            margin: 0 auto !important;
        }
       .bottom-banner-container {
            width: 90% !important;
        }
        .stats-box {
            width: fit-content !important;
            max-width: 90% !important;
            margin: 0 auto !important;
            display: flex !important; 
            padding: 15px 20px !important;
         }    
    </style>
</head>
