<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matt'$ Card$</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #860000;  
            --text-main: #ffffff; 
            --accent: #860000;   
            --success: #008000; 
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between; 
            align-items: center;
            border-bottom: none !important;
            padding-bottom: 20px;
        }
        .stats-box {
            background-color: #ffffff;
            color: #000000; 
            padding: 12px 20px;
            border-radius: 8px;
            text-align: center; 
            font-weight: bold;
            border: 4px solid #FF0000; 
            width: max-content; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }
        .stats-box span {
            font-size: 2.3rem; 
            font-weight: bold;
            display: block;
            color: var(--success); 
            margin-top: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }
        .grid-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 20px;
        }
        .card-link {
            text-decoration: none !important;
            color: inherit !important;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            border: 2px solid #ffffff;
        }
        .grid-container {
            background-color: #000000 !important;
            border: 4px solid #FF0000 !important;
            border-radius: 12px !important;
            padding: 25px !important;
            margin-top: 20px !important;
            margin-bottom: 20px !important;
        }
        .card:hover {
            transform: translateY(-2px);
            border-color: #ffffff !important; 
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6); 
        }
        .card-img {
            width: 100%;
            height: 260px; 
            background-color: #000000; 
            object-fit: contain;
            padding-top: 8px;
            display: block;
        }
        .card-info {
            padding: 12px;
        }
        .card-tag {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #ffffff; 
            font-weight: bold;
            margin-bottom: 4px;
            text-align: center; 
            text-shadow: 2px 2px 8px #ff0000;
        }
        .card-title {
            font-size: 1.15rem; 
            font-weight: bold; 
            margin: 0 0 10px 0;
            line-height: 1.3;
            color: #ffffff; 
            -webkit-text-stroke: unset; 
            text-shadow: 2px 2px 8px #000000;
            text-align: center; 
        }
        .card-details {
            font-size: 0.8rem; 
            color: #ffffff; 
            margin-bottom: 10px;
            line-height: 1.4;
            text-align: center; 
            text-shadow: 2px 2px 8px #ff0000;
        }
        .card-price {
            font-size: 0.95rem; 
            font-weight: bold;
            color: #ffffff; 
            background-color: #000000; 
            margin: 0 -12px -12px -12px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            text-align: left;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .card-price span:last-child {
            color: var(--success) !important;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        #error-msg { 
            color: var(--accent); 
            font-weight: bold; 
            text-align: center; 
            grid-column: 1 / -1;
            padding: 40px; 
        }
        .bottom-banner-wrapper {
            position: relative;
            width: 100% !important;
            max-width: 1200px !important;
            padding-top: 30px !important;
            margin: 0 auto !important;
            z-index: 10;
        }
        .bottom-banner-container {
            max-width: 1200px !important; 
            width: 25% !important;
            margin: 0 auto !important;
            padding: 0;
        }
        .bottom-banner-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        @media (max-width: 768px) {
        header, #main-header {
            flex-direction: column !important;
            gap: 20px !important;
            text-align: center !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
            width: 100% !important;
        }
        header div, #main-header div {
            align-items: center !important;
            width: 100% !important;
        }
        header img, #main-header img {
            align-self: center !important;
            margin: 0 auto !important;
        }
       .bottom-banner-container {
            width: 90% !important;
        }
        .stats-box {
            width: fit-content !important;
            max-width: 90% !important;
            margin: 0 auto !important;
            display: flex !important; 
            padding: 15px 20px !important;
         }    
}
    </style>
</head>
<body>
<header style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; width: 100%; padding: 20px;">
        <div style="display: flex; flex-direction: column; gap: 15px;">
        <img src="logo.png" alt="Matt'$ Card$" style="max-height: 120px; width: auto; object-fit: contain; align-self: flex-start;">
        <p style="margin: 0; color: #ffffff; font-size: 1.2rem; font-weight: bold; letter-spacing: 0.05em; text-transform: uppercase;
          text-shadow: 0 0 8px #ff0000, 0 0 15px #ff0000, 0 0 25px rgba(71, 85, 105, 0.6);">
            Sports Card Portfolio & Live Valuation
        </p>
    </div>
    <div class="stats-box" style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
        Total Estimated Value
        <span>$500+!</span>
        <p style="margin: 5px 0 0 0; color: #ff4d4d; font-size: 0.85rem; font-weight: bold;">
            <i>Updated 7/31/26</i>
        </p>
    </div>
</header>
    <main class="grid-container" id="gallery-grid">
        <div id="error-msg">Loading your collection live...</div>
    </main>
    <script>
        const MY_COLLECTION_URL = 'https://www.sportscardspro.com/offers?seller=xpx2saa54ajblfoc25cjsiw7ne&status=collection';

        fetch('collection.csv')
        .then(res => {
            if (!res.ok) throw new Error("Could not find collection.csv in folder.");
            return res.text();
        })
        .then(csvText => {
            const grid = document.getElementById('gallery-grid');
            const lines = csvText.trim().split('\n');
            const totalValueEl = document.getElementById('total-portfolio-value');
            
            grid.innerHTML = ''; 
            let totalPortfolioSum = 0;

            if (lines.length === 0 || csvText.trim() === "") {
                grid.innerHTML = '<div id="error-msg">The collection.csv file appears to be completely empty.</div>';
                return;
            }

            for (let i = 1; i < lines.length; i++) {
                const lineText = lines[i].trim();
                if (!lineText) continue; 

                const cells = lineText.split(',');

                const cardID = cells[0] ? cells[0].replace(/^"|"$/g, '').trim() : '';
                const productName = cells[1] ? cells[1].replace(/^"|"$/g, '').trim() : 'Unknown Card';
                
                let sport = cells[2] ? cells[2].replace(/^"|"$/g, '').trim() : '';
                sport = sport.replace(' Cards', ''); 

                const priceInPennies = parseFloat(cells[3] ? cells[3].replace(/^"|"$/g, '').trim() : 0) || 0;
                const price = priceInPennies / 100;

                const includeString = cells[4] ? cells[4].replace(/^"|"$/g, '').trim() : '';
                const quantity = parseInt(cells[9] ? cells[9].replace(/^"|"$/g, '').trim() : 1) || 1;
                const gradingCompany = cells[12] ? cells[12].replace(/^"|"$/g, '').trim() : '';
                
                totalPortfolioSum += (price * quantity);

                const photoUrl = cardID ? `${cardID}.jpg` : 'https://unsplash.com';

                let finalDetailsLabel = includeString;
                if (gradingCompany && gradingCompany !== 'None' && gradingCompany !== 'null' && gradingCompany !== 'undefined') {
                    finalDetailsLabel = `${includeString}`;
                }

                let qtyDisplay = quantity > 1 ? `<strong>Qty:</strong> ${quantity}<br>` : '';

                const cardHtml = `
                    <a href="${MY_COLLECTION_URL}" target="_blank" class="card-link">
                        <div class="card">
                            <img src="${photoUrl}" alt="${productName}" class="card-img" onerror="this.onerror=null; this.src='https://unsplash.com';">
                            <div class="card-info">
                                <div class="card-tag">${sport}</div>
                                <div class="card-title">${productName}</div>
                                <div class="card-details">
                                    <strong>Details:</strong> ${finalDetailsLabel} <br>
                                    ${qtyDisplay}
                                </div>
                                <div class="card-price">
                                    <span>Est. Value:</span>
                                    <span>$${price.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>
                    </a>
                `;
                grid.innerHTML += cardHtml;
            }

            totalValueEl.innerText = `$${totalPortfolioSum.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        })
        .catch(err => {
            document.getElementById('gallery-grid').innerHTML = '<div id="error-msg">System Failure: ' + err.message + '</div>';
            console.error(err);
        });
    </script>
<div style="background-color: #000000; padding: 25px; border: 4px solid #FF0000; border-radius: 12px; max-width: 1200px; margin: 20px auto; overflow: hidden;">
    <div style="background-color: #FFFFFF; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2);">
        <iframe src="https://www.sportscardspro.com/offers?seller=xpx2saa54ajblfoc25cjsiw7ne&status=collection" 
                width="100%" 
                height="750px" 
                style="border: none; display: block;">
        </iframe>
    </div>
</div>
  <div class="bottom-banner-wrapper">
    <div class="bottom-banner-container">
      <img src="banner.png" alt="Banner"><br><br>
      <img src="ape.jpg" alt="Matt'$ Card$">  
               <br><p style="text-align:center; margin:0; color:#ffffff; font-size: .75rem; font-weight: bold; letter-spacing: 0.05em;
                      text-shadow: 1px 1px 0px #334155, 2px 2px 0px #1e293b, 3px 3px 0px #0f172a, 4px 4px 5px rgba(0,0,0,0.8);">
                Copyright © 1985-2026 Matt'$ Card$
            </p>
    </div>
  </div>
</body>
</html>
