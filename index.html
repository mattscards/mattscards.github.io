<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matt'$ Card$</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center; 
            min-height: 100vh;
            padding: 40px 20px;
        }

        .site-wrapper {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center; 
            gap: 40px; 
        }

        .logo-section {
            text-align: center;
            width: 100%;
            margin-bottom: 10px;
        }

        .logo-image {
            max-width: 300px;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .custom-card-border {
            --background: linear-gradient(to left, #0077b8 0%, #82c40c 100%);
            padding: 4px;
            border-radius: 1rem;
            overflow: hidden;
            background: var(--background);
            position: relative;
            z-index: 1;
        }

        .custom-card-inner {
            --color: #000000;
            background: var(--color);
            width: 100%;
            height: 100%;
            border-radius: .7rem;
            overflow: hidden;
        }

        .iframe-wrapper {
            width: 100%;
            height: 700px;
        }

        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .value-box {
            width: 100%;
            max-width: 450px;
        }

        .value-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            text-align: center;
        }

    </style>
</head>
<body>

    <div class="site-wrapper">

        <header class="logo-section">
            <img src="mattscards.png" alt="Matt'$ Card$" class="logo-image">
        </header>

        <main class="custom-card-border iframe-wrapper">
            <div class="custom-card-inner">
                <iframe src="https://www.sportscardspro.com/offers?seller=xpx2saa54ajblfoc25cjsiw7ne&status=collection" title="Matt'$ Card$ @ SportsCardsPro"></iframe>
            </div>
        </main>

        <footer class="custom-card-border value-box">
            <div class="custom-card-inner value-content">
                <p>$1200+</p>
            </div>
        </footer>

    </div>

</body>
</html>
