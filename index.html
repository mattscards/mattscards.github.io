<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matt's Card Collection</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --text-main: #ffffff;
            --accent: #ff0000;
            --success: #107B13;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2d2d2d;
            padding-bottom: 20px;
        }
        .stats-box {
            background-color: #1e293b;
            color: #ffffff;
            padding: 15px 25px;
            border-radius: 8px;
            text-align: right;
            font-weight: bold;
            border: 2px solid var(--accent);
        }
        .stats-box span {
            font-size: 1.5rem;
            font-weight: bold;
            display: block;
            color: var(--success);
            margin-top: 5px;
        }
        .grid-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            border: 1px solid #2d2d2d;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 20px rgba(255, 0, 0, 0.15);
        }
        .card-img {
            width: 100%;
            height: 380px;
            background-color: #1a1a1a;
            object-fit: contain;
            padding-top: 10px;
        }
        .card-info {
            padding: 20px;
        }
        .card-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #a1a1aa;
            margin-bottom: 5px;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 0 0 10px 0;
        }
        .card-details {
            font-size: 0.9rem;
            color: #d4d4d8;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .card-price {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text-main);
            border-top: 1px solid #2d2d2d;
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
        }
        #loading {
            text-align: center;
            font-size: 1.2rem;
            grid-column: 1 / -1;
            padding: 40px;
            color: #a1a1aa;
        }
        @media (max-width: 768px) {
            header {
                flex-direction: column !important;
                align-items: center !important;
                text-align: center !important;
                gap: 20px;
            }
            header div {
                align-items: center !important;
            }
            header img {
                align-self: center !important;
                max-height: 90px !important;
            }
            .stats-box {
                width: 90%;
                text-align: center !important;
            }
        }
    </style>
    <!-- We are loading PapaParse, the world's most trusted, free, ad-free CSV reader tool -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <header>
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <img src="header.png" alt="Matt's Cards Logo" style="max-height: 120px; width: auto; object-fit: contain; align-self: flex-start;">
            <p style="margin:0; color:#ffffff; font-size: 1.2rem; font-weight: bold; letter-spacing: 0.05em; text-transform: uppercase;
                      text-shadow: 1px 1px 0px #334155, 2px 2px 0px #1e293b, 3px 3px 0px #0f172a, 4px 4px 5px rgba(0,0,0,0.8);">
                My Sports Card Portfolio & Live Valuation
            </p>
        </div>
        <div class="stats-box">
            Total Estimated Value
            <span id="total-portfolio-value">$0.00</span>
        </div>
    </header>

    <main class="grid-container" id="gallery-grid">
        <div id="loading">Loading your portfolio data live...</div>
    </main>

    <script>
        // 1. PLACE YOUR SPREADSHEET KEY HERE
        const SHEET_ID = '1kqFhCWpaWhSKK2tdhOwJFUiot600z88Hthet2PSr-xc';
        // 2. PLACE YOUR EXACT TAB NAME HERE
        const SHEET_TITLE = 'collection'; 

        // This fetches the raw text from Google Sheets exactly as a pure CSV file stream
        const FULL_URL = `https://google.com{SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_TITLE)}`;

        fetch(FULL_URL)
        .then(res => res.text())
        .then(csvText => {
            // Papa.parse automatically cleans up the CSV data and splits it into perfect arrays
            const parsedData = Papa.parse(csvText, { header: true, skipEmptyLines: true });
            const rows = parsedData.data;
            
            const grid = document.getElementById('gallery-grid');
            const totalValueEl = document.getElementById('total-portfolio-value');
            
            grid.innerHTML = ''; 
            let totalPortfolioSum = 0;

            rows.forEach(row => {
                // Map columns exactly by the CSV header names you provided
                const cardId = row['id'] || '';
                const productName = row['product-name'] || 'Unknown Card';
                
                let sport = row['console-name'] || '';
                sport = sport.replace(' Cards', ''); 

                const priceInPennies = parseFloat(row['price-in-pennies']) || 0;
                const price = priceInPennies / 100;

                const condition = row['condition-string'] || 'Ungraded';
                const quantity = parseInt(row['quantity']) || 1;
                const gradingCompany = row['grading-company'] || '';

                totalPortfolioSum += (price * quantity);

                // Fetch image based on the unique ID
                const photoUrl = cardId ? `https://pricecharting.com{cardId}.jpg` : 'https://placeholder.com';

                let finalCondition = condition;
                if (gradingCompany && gradingCompany !== 'None' && gradingCompany !== 'null') {
                    finalCondition = `${gradingCompany} ${condition}`;
                }

                let qtyDisplay = quantity > 1 ? `<strong>Qty:</strong> ${quantity}<br>` : '';

                const cardHtml = `
                    <div class="card">
                        <img src="${photoUrl}" alt="${productName}" class="card-img" onerror="this.src='https://placeholder.com'">
                        <div class="card-info">
                            <div class="card-tag">${sport}</div>
                            <div class="card-title">${productName}</div>
                            <div class="card-details">
                                <strong>Condition:</strong> ${finalCondition} <br>
                                ${qtyDisplay}
                            </div>
                            <div class="card-price">
                                <span>Est. Value:</span>
                                <span style="color:var(--success);">$${price.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });

            totalValueEl.innerText = `$${totalPortfolioSum.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        })
        .catch(err => {
            document.getElementById('gallery-grid').innerHTML = "Error syncing data feed. Double check your configuration settings.";
            console.error(err);
        });
    </script>
</body>
</html>
