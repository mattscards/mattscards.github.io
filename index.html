<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Testing Table</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #ffffff; color: #000000; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #dddddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        #error-msg { color: red; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>CSV Connection Test Matrix</h1>
    <p>If the script works, your raw spreadsheet data will appear in the table below:</p>

    <div id="error-msg"></div>

    <table id="test-table">
        <!-- Rows will generate here -->
    </table>

    <script>
        // Directly target the file sitting in your GitHub folder
        fetch('collection.csv')
        .then(res => {
            if (!res.ok) throw new Error("The website could not find a file named 'collection.csv' in your GitHub folder.");
            return res.text();
        })
        .then(csvText => {
            const table = document.getElementById('test-table');
            
            // Split the text file into individual rows using the line breaks
            const rows = csvText.trim().split('\n');

            if (rows.length === 0 || csvText.trim() === "") {
                document.getElementById('error-msg').innerText = "The collection.csv file was found, but it appears to be completely empty.";
                return;
            }

            // Loop through every single row found in the CSV text
            rows.forEach((rowText, index) => {
                const tr = document.createElement('tr');
                
                // Native JavaScript split: break the row apart by its commas
                const cells = rowText.split(',');
                
                cells.forEach(cellText => {
                    const cell = document.createElement(index === 0 ? 'th' : 'td');
                    // Clean up any extra quotation marks that spreadsheets add around text
                    cell.innerText = cellText.replace(/^"|"$/g, '').trim();
                    tr.appendChild(cell);
                });
                
                table.appendChild(tr);
            });
        })
        .catch(err => {
            document.getElementById('error-msg').innerText = "System Failure: " + err.message;
            console.error(err);
        });
    </script>

</body>
</html>
