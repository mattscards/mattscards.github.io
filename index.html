<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matt'$ Card$</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center; 
            min-height: 100vh;
            padding: 40px 20px;
        }

        .site-wrapper {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center; 
            gap: 15px; 
        }

        .logo-section {
            text-align: center;
            width: 100%;
            margin-bottom: 0px;
        }

        .logo-image {
            max-width: 500px; 
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .custom-card-border {
            --background: linear-gradient(to left, #0077b8 0%, #82c40c 100%);
            padding: 4px; 
            border-radius: 1rem;
            overflow: hidden;
            background: var(--background);
            position: relative;
            z-index: 1;
        }

        .custom-card-inner {
            --color: #000000; 
            background: var(--color);
            width: 100%;
            height: 100%;
            border-radius: .7rem;
            overflow: hidden;
        }

        .iframe-wrapper {
            width: 100%;
            height: 700px; 
        }

        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none; 
        }

        .value-box {
            width: 100%;
            max-width: 450px; 
        }

        .value-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            text-align: center;
            gap: 12px; 
        }

        .value-title {
            color: #82c40c; 
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .value-amount {
            color: #ffffff; 
            font-size: 3rem; 
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1;
        }

        .value-date {
            color: #0077b8; 
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .site-footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px; 
            margin-top: 10px;
            padding-bottom: 20px;
            width: 100%;
        }

        .footer-icon {
            width: 32px; 
            height: auto;
            object-fit: contain;
        }

        .footer-text {
            color: #ffffff; 
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-align: center;
        }

        @media (max-width: 768px) {
          
            body {
                padding: 20px 12px; 
            }

            .site-wrapper {
                gap: 10px; 
            }

            .logo-image {
                max-width: 220px; 
            }

            .iframe-wrapper {
                height: 550px; 
            }

            .custom-card-border {
                padding: 3px; 
            }

            .value-content {
                padding: 20px 15px; 
                gap: 8px;
            }

            .value-title {
                font-size: 0.95rem; 
            }

            .value-amount {
                font-size: 2.4rem; 
            }

            .value-date {
                font-size: 0.8rem;
            }
        }

    </style>
</head>
<body>

    <div class="site-wrapper">

        <header class="logo-section">
            <img src="mattscards.png" alt="Matt'$ Card$" class="logo-image">
        </header>

        <main class="custom-card-border iframe-wrapper">
            <div class="custom-card-inner">
                <iframe src="https://www.sportscardspro.com/offers?seller=xpx2saa54ajblfoc25cjsiw7ne&status=collection" title="Matt'$ Card$ @ SportsCardsPro"></iframe>
            </div>
        </main>

        <footer class="custom-card-border value-box">
            <div class="custom-card-inner value-content">
                <div class="value-title">Total Estimated Value</div>
                <div class="value-amount">$1200+</div>
                <div class="value-date">Updated 8/4/26</div>
            </div>
        </footer>

        <footer class="site-footer">
            <img src="black_background.png" alt="Footer Icon" class="footer-icon">
            <p class="footer-text">© 1985-2026 Matt'$ Card$. All Rights Reserved.</p>
        </footer>

    </div>

</body>
</html>
