<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matt's Card Collection</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --text-main: #ffffff;
            --accent: #ff0000;
            --success: #107B13;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2d2d2d;
            padding-bottom: 20px;
        }
        .stats-box {
            background-color: #1e293b;
            color: #ffffff;
            padding: 15px 25px;
            border-radius: 8px;
            text-align: right;
            font-weight: bold;
            border: 2px solid var(--accent);
        }
        .stats-box span {
            font-size: 1.5rem;
            font-weight: bold;
            display: block;
            color: var(--success);
            margin-top: 5px;
        }
        
        /* Temporary Raw Table Styling for Dark Mode */
        table { width: 100%; max-width: 1200px; margin: 20px auto; border-collapse: collapse; background-color: var(--card-bg); }
        th, td { border: 1px solid #2d2d2d; padding: 12px; text-align: left; }
        th { background-color: #1e293b; color: #ffffff; font-weight: bold; }
        #error-msg { color: var(--accent); font-weight: bold; text-align: center; margin-top: 20px; }

        @media (max-width: 768px) {
            header {
                flex-direction: column !important;
                align-items: center !important;
                text-align: center !important;
                gap: 20px;
            }
            header div {
                align-items: center !important;
            }
            header img {
                align-self: center !important;
                max-height: 90px !important;
            }
            .stats-box {
                width: 90%;
                text-align: center !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <img src="logo.png" alt="Matt's Cards Logo" style="max-height: 120px; width: auto; object-fit: contain; align-self: flex-start;">
            <p style="margin:0; color:#ffffff; font-size: 1.2rem; font-weight: bold; letter-spacing: 0.05em; text-transform: uppercase;
                      text-shadow: 1px 1px 0px #334155, 2px 2px 0px #1e293b, 3px 3px 0px #0f172a, 4px 4px 5px rgba(0,0,0,0.8);">
                My Sports Card Portfolio & Live Valuation
            </p>
        </div>
        <div class="stats-box">
            Total Estimated Value
            <span id="total-portfolio-value">$0.00</span>
        </div>
    </header>

    <div id="error-msg"></div>

    <table id="test-table">
        <!-- Rows will generate here -->
    </table>

    <script>
        fetch('collection.csv')
        .then(res => {
            if (!res.ok) throw new Error("Could not find collection.csv in folder.");
            return res.text();
        })
        .then(csvText => {
            const table = document.getElementById('test-table');
            const rows = csvText.trim().split('\n');
            const totalValueEl = document.getElementById('total-portfolio-value');
            let totalPortfolioSum = 0;

            if (rows.length === 0 || csvText.trim() === "") {
                document.getElementById('error-msg').innerText = "The collection.csv file appears to be completely empty.";
                return;
            }

            rows.forEach((rowText, index) => {
                const tr = document.createElement('tr');
                const cells = rowText.split(',');
                
                // If it's a data row, let's look for the price column (Column D / Index 3) to calculate the total portfolio value box
                if (index > 0 && cells[3]) {
                    // Stripping quotes and parsing pennies from your specific layout
                    const priceInPennies = parseFloat(cells[3].replace(/^"|"$/g, '').trim()) || 0;
                    const quantity = parseInt(cells[9]?.replace(/^"|"$/g, '').trim()) || 1; // Quantity is Column J / Index 9
                    totalPortfolioSum += (priceInPennies / 100) * quantity;
                }

                cells.forEach(cellText => {
                    const cell = document.createElement(index === 0 ? 'th' : 'td');
                    cell.innerText = cellText.replace(/^"|"$/g, '').trim();
                    tr.appendChild(cell);
                });
                
                table.appendChild(tr);
            });

            // Update the top box calculation dynamically
            totalValueEl.innerText = `$${totalPortfolioSum.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        })
        .catch(err => {
            document.getElementById('error-msg').innerText = "System Failure: " + err.message;
            console.error(err);
        });
    </script>

</body>
</html>
