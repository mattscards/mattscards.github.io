<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matt's Card Collection</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --text-main: #ffffff;
            --accent: #ff0000;
            --success: #107B13;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2d2d2d;
            padding-bottom: 20px;
        }
        .stats-box {
            background-color: #1e293b;
            color: #ffffff;
            padding: 15px 25px;
            border-radius: 8px;
            text-align: right;
            font-weight: bold;
            border: 2px solid var(--accent);
        }
        .stats-box span {
            font-size: 1.5rem;
            font-weight: bold;
            display: block;
            color: var(--success);
            margin-top: 5px;
        }
        .grid-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            border: 1px solid #2d2d2d;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 20px rgba(255, 0, 0, 0.15);
        }
        .card-img {
            width: 100%;
            height: 380px;
            background-color: #1a1a1a;
            object-fit: contain;
            padding-top: 10px;
        }
        .card-info {
            padding: 20px;
        }
        .card-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #a1a1aa;
            margin-bottom: 5px;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 0 0 10px 0;
        }
        .card-details {
            font-size: 0.9rem;
            color: #d4d4d8;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .card-price {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text-main);
            border-top: 1px solid #2d2d2d;
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
        }
        #loading {
            text-align: center;
            font-size: 1.2rem;
            grid-column: 1 / -1;
            padding: 40px;
            color: #a1a1aa;
        }
        a {
            color: #ff0000 !important;
            text-decoration: none;
        }
        a:hover {
            color: #ff3333 !important;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column !important;
                align-items: center !important;
                text-align: center !important;
                gap: 20px;
            }
            header div {
                align-items: center !important;
            }
            header img {
                align-self: center !important;
                max-height: 90px !important;
            }
            .stats-box {
                width: 90%;
                text-align: center !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <img src="logo.png" alt="Matt's Cards Logo" style="max-height: 120px; width: auto; object-fit: contain; align-self: flex-start;">
            <p style="margin:0; color:#ffffff; font-size: 1.2rem; font-weight: bold; letter-spacing: 0.05em; text-transform: uppercase;
                      text-shadow: 1px 1px 0px #334155, 2px 2px 0px #1e293b, 3px 3px 0px #0f172a, 4px 4px 5px rgba(0,0,0,0.8);">
                My Sports Card Portfolio & Live Valuation
            </p>
        </div>
        <div class="stats-box">
            Total Estimated Value
            <span id="total-portfolio-value">$0.00</span>
        </div>
    </header>

    <main class="grid-container" id="gallery-grid">
        <div id="loading">Loading your portfolio data live...</div>
    </main>

    <script>
        // PASTE YOUR GOOGLE SPREADSHEET ID HERE
        const SHEET_ID = '1kuV9SUJYadPdIJ-ExWuZrBYlor3HMlbOPNHXo7LZr5w';
        const SHEET_TITLE = 'collection.csv'; 
        const SHEET_RANGE = 'A2:O1000'; // Reads all 15 columns from your CSV format

        const FULL_URL = `https://google.com{SHEET_ID}/gviz/tq?sheet=${SHEET_TITLE}&range=${SHEET_RANGE}`;

        fetch(FULL_URL)
        .then(res => res.text())
        .then(rep => {
            const data = JSON.parse(rep.substr(47).slice(0, -2));
            const grid = document.getElementById('gallery-grid');
            const totalValueEl = document.getElementById('total-portfolio-value');
            
            grid.innerHTML = ''; 
            let totalPortfolioSum = 0;

            data.table.rows.forEach(row => {
                if (!row.c || !row.c[0]) return; // Skip completely empty rows safely

                // Safely extract variables from the spreadsheet positions
                const cardId = row.c[0] ? row.c[0].v : '';
                const productName = row.c[1] ? row.c[1].v : 'Unknown Card';
                
                let sport = row.c[2] ? row.c[2].v : '';
                sport = sport.replace(' Cards', ''); // Cleans up "Baseball Cards" to just "Baseball"

                const priceInPennies = row.c[3] ? parseFloat(row.c[3].v) : 0;
                const price = priceInPennies / 100;

                const condition = row.c[5] ? row.c[5].v : 'Ungraded';
                const quantity = row.c[9] ? parseInt(row.c[9].v) : 1;
                const gradingCompany = row.c[12] ? row.c[12].v : '';

                // Calculate grand total portfolio value
                totalPortfolioSum += (price * quantity);

                // Fetch official thumbnail image link from SportsCardsPro database
                const photoUrl = cardId ? `https://pricecharting.com{cardId}.jpg` : 'https://placeholder.com';

                // Combine grading company and condition if graded (e.g., "PSA 10")
                let finalCondition = condition;
                if (gradingCompany && gradingCompany !== 'None') {
                    finalCondition = `${gradingCompany} ${condition}`;
                }

                // Show quantity label only if you own more than 1 copy of the card
                let qtyDisplay = quantity > 1 ? `<strong>Qty:</strong> ${quantity}<br>` : '';

                const cardHtml = `
                    <div class="card">
                        <img src="${photoUrl}" alt="${productName}" class="card-img" onerror="this.src='https://placeholder.com'">
                        <div class="card-info">
                            <div class="card-tag">${sport}</div>
                            <div class="card-title">${productName}</div>
                            <div class="card-details">
                                <strong>Condition:</strong> ${finalCondition} <br>
                                ${qtyDisplay}
                            </div>
                            <div class="card-price">
                                <span>Est. Value:</span>
                                <span style="color:var(--success);">$${price.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });

            totalValueEl.innerText = `$${totalPortfolioSum.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        })
        .catch(err => {
            document.getElementById('loading').innerText = "Make sure your Google Sheet access is set to 'Anyone with the link can view'.";
            console.error(err);
        });
    </script>
</body>
</html>
