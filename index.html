<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Testing Table</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #ffffff; color: #000000; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #dddddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        #error-msg { color: red; font-weight: bold; margin-top: 20px; }
    </style>
    <!-- Loading PapaParse to handle splitting the spreadsheet text row by row -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <h1>CSV Connection Test Matrix</h1>
    <p>If the script works, your raw spreadsheet data will appear in the table below:</p>

    <div id="error-msg"></div>

    <table id="test-table">
        <!-- The headers and rows will be generated here by the computer -->
    </table>

    <script>
        // Directly target the file sitting in your GitHub folder
        fetch('collection.csv')
        .then(res => {
            if (!res.ok) throw new Error("The website could not find a file named 'collection.csv' in your GitHub folder.");
            return res.text();
        })
        .then(csvText => {
            // Parse the CSV text into basic arrays of columns
            const parsed = Papa.parse(csvText.trim(), { skipEmptyLines: true });
            const rows = parsed.data;
            const table = document.getElementById('test-table');
            
            if (rows.length === 0) {
                document.getElementById('error-msg').innerText = "The collection.csv file was found, but it appears to be completely empty.";
                return;
            }

            // Loop through every single row found in the CSV file
            rows.forEach((row, index) => {
                const tr = document.createElement('tr');
                
                // Loop through every column cell inside that row
                row.forEach(cellText => {
                    const cell = document.createElement(index === 0 ? 'th' : 'td');
                    cell.innerText = cellText;
                    tr.appendChild(cell);
                });
                
                table.appendChild(tr);
            });
        })
        .catch(err => {
            document.getElementById('error-msg').innerText = "System Failure: " + err.message;
            console.error(err);
        });
    </script>

</body>
</html>
